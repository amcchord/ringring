[general]

; RingRing never records conferences. The bridge is only an implementation
; detail for a live, private party call and its invited joiners.
[ringring_bridge]
type=bridge
max_members=20
record_conference=no

; The two people who started the call are marked. If either hangs up, everyone
; is removed, preserving ordinary phone-call ownership semantics.
[ringring_initial]
type=user
marked=yes
end_marked_any=yes
quiet=yes
jitterbuffer=yes

[ringring_joiner]
type=user
marked=no
end_marked_any=yes
quiet=yes
jitterbuffer=yes

[ringring_announcer]
type=user
marked=no
quiet=yes
jitterbuffer=yes
