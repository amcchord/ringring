[general]
static=yes
writeprotect=yes
clearglobalvars=yes

[globals]

[rr-phone-check]
exten => s,1,Set(CDR_PROP(disable)=1)
 same => n,Set(TIMEOUT(absolute)=20)
 same => n,Playback(hello)
 same => n,Playback(your)
 same => n,Playback(extension)
 same => n,Playback(is)
 same => n,SayDigits(${RINGRING_EXTENSION})
 same => n,Playback(auth-thankyou)
 same => n,Hangup()

; Dial's G option sends the original caller to priority 1 and the answering
; phone to priority 2. Both then enter the same private, generated conference.
[rr-party-bridge]
exten => s,1,Set(CDR_PROP(disable)=1)
exten => s,2,Set(CDR_PROP(disable)=1)
 same => n,ConfBridge(${RINGRING_CONFERENCE},ringring_bridge,ringring_initial)
 same => n,Hangup()

; AMI may originate only this fixed Local channel to play a short, generated
; join announcement into a validated RingRing conference.
[rr-party-announcement]
exten => s,1,Set(CDR_PROP(disable)=1)
 same => n,Set(TIMEOUT(absolute)=15)
 same => n,ConfBridge(${RINGRING_CONFERENCE},ringring_bridge,ringring_announcer)
 same => n,Hangup()

#include /var/lib/ringring/asterisk/extensions.conf
